name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version MAJOR.MINOR.PATCH. Leave empty for automatic next patch.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate main branch
      shell: pwsh
      run: |
        $ref = "${{ github.ref }}"
        if ($ref -ne "refs/heads/main") {
          Write-Error "Release Candidate must be dispatched from main. Current ref: $ref"
          exit 1
        }
        Write-Output "Branch validated: main"

    - name: Resolve release version
      id: resolve
      shell: pwsh
      run: |
        $manualVersion = "${{ inputs.version }}"
        $result = & "${{ github.workspace }}\scripts\Resolve-ReleaseVersion.ps1" -ManualVersion $manualVersion

        # Parse output
        $versionLine = $result | Where-Object { $_ -match '^RELEASE_VERSION=' }
        $tagLine = $result | Where-Object { $_ -match '^RELEASE_TAG=' }
        $logLines = $result | Where-Object { $_ -notmatch '^RELEASE_' }

        # Print log
        $logLines | ForEach-Object { Write-Output $_ }

        $version = ($versionLine -split '=', 2)[1]
        $tag = ($tagLine -split '=', 2)[1]

        Write-Output "RELEASE_VERSION=$version" >> $env:GITHUB_OUTPUT
        Write-Output "RELEASE_TAG=$tag" >> $env:GITHUB_OUTPUT
        Write-Output "Resolved: $version ($tag)"

    - name: Check tag does not exist (local + remote)
      shell: pwsh
      run: |
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"

        $local = git tag -l $tag
        if ($local) {
          Write-Error "Tag $tag already exists locally."
          exit 1
        }

        $remoteOutput = git ls-remote origin "refs/tags/$tag" 2>&1
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Failed to query remote for tag $tag (exit code $LASTEXITCODE)"
          exit 1
        }
        if ($remoteOutput) {
          Write-Error "Tag $tag already exists on remote."
          exit 1
        }

        Write-Output "Tag $tag is available (local + remote)"

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore BdoUaClient.sln

    - name: Build Release
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $parts = $version.Split('.')
        $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"

        dotnet build BdoUaClient.sln `
          -c Release `
          --no-restore `
          -p:Version=$version `
          -p:AssemblyVersion=$assemblyVersion `
          -p:FileVersion=$assemblyVersion `
          -p:InformationalVersion=$version `
          -p:IncludeSourceRevisionInInformationalVersion=false

    - name: Test Release
      run: dotnet test BdoUaClient.sln -c Release --no-build

    - name: Publish single-file win-x64
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $parts = $version.Split('.')
        $assemblyVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"

        dotnet publish BdoClient.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishTrimmed=false `
          -p:AssemblyName=BDO-WWM-UAClient `
          -p:Version=$version `
          -p:AssemblyVersion=$assemblyVersion `
          -p:FileVersion=$assemblyVersion `
          -p:InformationalVersion=$version `
          -p:IncludeSourceRevisionInInformationalVersion=false `
          -o artifacts/publish/win-x64

    - name: Verify EXE exists
      shell: pwsh
      run: |
        $exe = "artifacts/publish/win-x64/BDO-WWM-UAClient.exe"
        if (!(Test-Path $exe)) {
          Write-Error "EXE not found at $exe"
          exit 1
        }
        $size = (Get-Item $exe).Length
        Write-Output "EXE found: $size bytes"

    - name: Verify EXE version metadata
      shell: pwsh
      run: |
        $exe = "artifacts/publish/win-x64/BDO-WWM-UAClient.exe"
        $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $expectedFileVersion = "$version.0"

        Write-Output "Expected FileVersion:    $expectedFileVersion"
        Write-Output "Actual FileVersion:      $($info.FileVersion)"
        Write-Output "Expected ProductVersion: $version"
        Write-Output "Actual ProductVersion:   $($info.ProductVersion)"

        if ($info.FileVersion -ne $expectedFileVersion) {
          Write-Error "FileVersion '$($info.FileVersion)' does not exactly equal '$expectedFileVersion'"
          exit 1
        }
        if ($info.ProductVersion -ne $version) {
          Write-Error "ProductVersion '$($info.ProductVersion)' does not exactly equal '$version'"
          exit 1
        }
        Write-Output "EXE version metadata verified (exact match)"

    - name: Prepare canonical and legacy bundles
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"
        $sourceSha = "${{ github.sha }}"
        $sourceExe = "artifacts/publish/win-x64/BDO-WWM-UAClient.exe"
        $canonicalDir = "artifacts/bundles/canonical"
        $legacyDir = "artifacts/bundles/legacy"
        New-Item -ItemType Directory -Force -Path $canonicalDir, $legacyDir | Out-Null

        $canonicalExe = "BDO-WWM-UAClient.exe"
        $legacyExe = "BDO-UA-Client.exe"
        Copy-Item -LiteralPath $sourceExe -Destination (Join-Path $canonicalDir $canonicalExe)
        Copy-Item -LiteralPath $sourceExe -Destination (Join-Path $legacyDir $legacyExe)
        $canonicalHash = (Get-FileHash -LiteralPath (Join-Path $canonicalDir $canonicalExe) -Algorithm SHA256).Hash.ToLowerInvariant()
        $legacyHash = (Get-FileHash -LiteralPath (Join-Path $legacyDir $legacyExe) -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($canonicalHash -ne $legacyHash) { throw "Canonical and legacy executable payloads differ." }

        $runId = "${{ github.run_id }}"
        foreach ($bundle in @(@{ Directory = $canonicalDir; Exe = $canonicalExe }, @{ Directory = $legacyDir; Exe = $legacyExe })) {
          $manifest = @{
            schema_version = 2
            version = $version
            tag = $tag
            commit_sha = $sourceSha
            asset_name = $bundle.Exe
            sha256 = $canonicalHash
            platform = "win-x64"
            workflow_run_id = $runId
          } | ConvertTo-Json -Depth 2
          $manifest | Out-File -LiteralPath (Join-Path $bundle.Directory "release-manifest.json") -Encoding utf8
          @("$canonicalHash  $($bundle.Exe)") | Out-File -LiteralPath (Join-Path $bundle.Directory "SHA256SUMS.txt") -Encoding utf8

          $writtenManifest = Get-Content -LiteralPath (Join-Path $bundle.Directory "release-manifest.json") -Raw | ConvertFrom-Json
          $writtenSums = (Get-Content -LiteralPath (Join-Path $bundle.Directory "SHA256SUMS.txt") -Raw).TrimEnd("`r", "`n")
          $expectedSums = "$canonicalHash  $($bundle.Exe)"
          if ($writtenManifest.asset_name -ne $bundle.Exe -or $writtenManifest.sha256 -ne $canonicalHash -or $writtenSums -ne $expectedSums) {
            throw "Bundle contract verification failed for $($bundle.Exe)."
          }
        }
        Write-Output "Both filename-specific manifests and sums verified against identical executable bytes: $canonicalHash"

    - name: Generate release notes from structured source
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"
        $sha = "${{ github.sha }}"
        $canonicalAssetName = "BDO-WWM-UAClient-v$version-win-x64.zip"
        $legacyAssetName = "BDO-UA-Client-v$version-win-x64.zip"
        $exeHash = (Get-FileHash -LiteralPath "artifacts/bundles/canonical/BDO-WWM-UAClient.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
        $canonicalNotes = & "${{ github.workspace }}\scripts\Generate-ReleaseNotes.ps1" `
          -Version $version -Tag $tag -Sha $sha -AssetName $canonicalAssetName -ExeSha256 $exeHash `
          -FragmentsPath "${{ github.workspace }}\docs\releases\NEXT.json"
        $legacyExeHash = (Get-FileHash -LiteralPath "artifacts/bundles/legacy/BDO-UA-Client.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
        $legacyNotes = & "${{ github.workspace }}\scripts\Generate-ReleaseNotes.ps1" `
          -Version $version -Tag $tag -Sha $sha -AssetName $legacyAssetName -ExeSha256 $legacyExeHash `
          -FragmentsPath "${{ github.workspace }}\docs\releases\NEXT.json"
        $canonicalNotes | Out-File -LiteralPath "artifacts/bundles/canonical/RELEASE_NOTES-v$version.md" -Encoding utf8
        $legacyNotes | Out-File -LiteralPath "artifacts/bundles/legacy/RELEASE_NOTES-v$version.md" -Encoding utf8
        Write-Output "Identity-specific release notes generated for both bundles."

    - name: Verify complete bundle layouts
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        foreach ($bundle in @(
          @{ Directory = "artifacts/bundles/canonical"; Exe = "BDO-WWM-UAClient.exe" },
          @{ Directory = "artifacts/bundles/legacy"; Exe = "BDO-UA-Client.exe" }
        )) {
          $expectedNames = @($bundle.Exe, "release-manifest.json", "SHA256SUMS.txt", "RELEASE_NOTES-v$version.md") | Sort-Object
          $actualNames = @(Get-ChildItem -LiteralPath $bundle.Directory -File | ForEach-Object Name | Sort-Object)
          if ($actualNames.Count -ne 4 -or ($actualNames -join "|") -ne ($expectedNames -join "|")) {
            throw "Unexpected files in bundle $($bundle.Directory): $($actualNames -join ', ')"
          }
          $exeHash = (Get-FileHash -LiteralPath (Join-Path $bundle.Directory $bundle.Exe) -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = Get-Content -LiteralPath (Join-Path $bundle.Directory "release-manifest.json") -Raw | ConvertFrom-Json
          $sums = (Get-Content -LiteralPath (Join-Path $bundle.Directory "SHA256SUMS.txt") -Raw).TrimEnd("`r", "`n")
          if ($manifest.version -ne $version -or $manifest.asset_name -ne $bundle.Exe -or $manifest.sha256 -ne $exeHash -or $sums -ne "$exeHash  $($bundle.Exe)") {
            throw "Manifest/SHA-256 contract failed in $($bundle.Directory)."
          }
          Write-Output "Verified $($bundle.Exe), $exeHash, and exactly four flat files."
        }

    - name: Upload canonical artifact
      uses: actions/upload-artifact@v4
      with:
        name: BDO-WWM-UAClient-v${{ steps.resolve.outputs.RELEASE_VERSION }}-win-x64
        path: artifacts/bundles/canonical/*

    - name: Upload legacy compatibility artifact
      uses: actions/upload-artifact@v4
      with:
        name: BDO-UA-Client-v${{ steps.resolve.outputs.RELEASE_VERSION }}-win-x64
        path: artifacts/bundles/legacy/*

    - name: Summary
      shell: pwsh
      run: |
        $version = "${{ steps.resolve.outputs.RELEASE_VERSION }}"
        $tag = "${{ steps.resolve.outputs.RELEASE_TAG }}"
        $sha = "${{ github.sha }}"
        $inputVersion = "${{ inputs.version }}"
        if ($inputVersion -and $inputVersion.Trim() -ne "") {
          $source = "Manual"
        } else {
          $source = "Automatic patch"
        }
        $verifiedExeSha = (Get-FileHash -LiteralPath "artifacts/bundles/canonical/BDO-WWM-UAClient.exe" -Algorithm SHA256).Hash.ToLowerInvariant()

        @"
        ## Release Candidate v$version

        | | |
        |---|---|
        | **Version source** | $source |
        | **Version** | $version |
        | **Proposed final tag** | ``$tag`` (not created by the RC workflow) |
        | **Commit** | ``$sha`` |
        | **Source SHA** | ``$sha`` |
        | **Canonical artifact** | ``BDO-WWM-UAClient-v$version-win-x64`` |
        | **Legacy compatibility artifact** | ``BDO-UA-Client-v$version-win-x64`` |

        ### Bundle contracts

        Each GitHub Actions artifact contains exactly four flat files. The canonical bundle contains ``BDO-WWM-UAClient.exe``; the legacy bundle contains ``BDO-UA-Client.exe``. Each has its own schema-2 manifest and sums filename, and both EXE payloads are byte-identical (SHA-256 ``$verifiedExeSha``).

        ### Next steps

        1. Download and test canonical artifact ``BDO-WWM-UAClient-v$version-win-x64``
        2. Verify the legacy compatibility artifact ``BDO-UA-Client-v$version-win-x64`` is also present
        3. Do NOT unpack/repackage either downloaded artifact ZIP for publication
        4. Perform Owner native UI smoke on ``BDO-WWM-UAClient.exe`` from this exact RC/source SHA
        5. After Owner approval, create and push ``$tag`` on the exact source SHA ``$sha``
        6. Draft GitHub Release → select the existing tag ``$tag``
        7. Use ``RELEASE_NOTES-v$version.md`` generated from ``docs/releases/NEXT.json`` directly as the release body; edit only to correct a factual defect found during owner validation
        8. Upload both EXACT downloaded artifact ZIPs as the canonical and legacy compatibility application assets
        9. Do NOT separately upload either EXE, ``release-manifest.json`` or ``SHA256SUMS.txt``
        10. Click **Publish release**

        > Final tag creation and GitHub Release publication are intentionally outside this RC workflow.
        "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
