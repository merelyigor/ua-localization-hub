name: Test Build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore BdoUaClient.sln

    - name: Build Release
      shell: pwsh
      run: |
        $sha = "${{ github.sha }}"
        $shortSha = $sha.Substring(0, 7)
        $infoVersion = "0.0.0-dev.$shortSha"

        dotnet build BdoUaClient.sln `
          -c Release `
          --no-restore `
          -p:Version=0.0.0 `
          -p:AssemblyVersion=0.0.0.0 `
          -p:FileVersion=0.0.0.0 `
          -p:InformationalVersion=$infoVersion

    - name: Test Release
      run: dotnet test BdoUaClient.sln -c Release --no-build

    - name: Publish single-file win-x64
      shell: pwsh
      run: |
        $sha = "${{ github.sha }}"
        $shortSha = $sha.Substring(0, 7)
        $infoVersion = "0.0.0-dev.$shortSha"

        dotnet publish BdoClient.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishTrimmed=false `
          -p:AssemblyName=BDO-WWM-UAClient `
          -p:Version=0.0.0 `
          -p:AssemblyVersion=0.0.0.0 `
          -p:FileVersion=0.0.0.0 `
          -p:InformationalVersion=$infoVersion `
          -o artifacts/publish/win-x64

    - name: Verify EXE version
      shell: pwsh
      run: |
        $exe = "artifacts/publish/win-x64/BDO-WWM-UAClient.exe"
        $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
        Write-Output "FileVersion:    $($info.FileVersion)"
        Write-Output "ProductVersion: $($info.ProductVersion)"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BDO-WWM-UAClient-test-build-win-x64
        path: artifacts/publish/win-x64/BDO-WWM-UAClient.exe
