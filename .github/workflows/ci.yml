name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore
      run: dotnet restore BdoUaClient.sln

    - name: Workflow contract
      shell: pwsh
      run: scripts/Check-WorkflowContract.ps1

    - name: Repository safety scan
      shell: pwsh
      run: scripts/Check-RepositorySafety.ps1

    - name: Harness regression tests
      shell: pwsh
      run: scripts/Test-ProjectHarness.ps1

    - name: Build
      run: dotnet build BdoUaClient.sln --configuration Release --no-restore -warnaserror

    - name: Test
      run: dotnet test BdoUaClient.sln --configuration Release --no-build

    - name: Version resolver tests
      shell: pwsh
      run: scripts/Test-Resolve-ReleaseVersion.ps1

    - name: Release notes generator tests
      shell: pwsh
      run: scripts/Test-Generate-ReleaseNotes.ps1

    - name: Project chat rules size check
      shell: pwsh
      run: scripts/Check-ProjectChatRules.ps1

    - name: Version resolver smoke (real origin)
      shell: pwsh
      run: |
        $result = & scripts/Resolve-ReleaseVersion.ps1 -ManualVersion ""
        $result | ForEach-Object { Write-Output $_ }
        $version = ($result | Where-Object { $_ -match '^RELEASE_VERSION=' } | ForEach-Object { ($_ -split '=', 2)[1] })
        $tag = ($result | Where-Object { $_ -match '^RELEASE_TAG=' } | ForEach-Object { ($_ -split '=', 2)[1] })
        if ($tag -ne "v$version") {
          Write-Error "Tag mismatch: RELEASE_TAG=$tag != v$version"
          exit 1
        }
        Write-Output "Smoke passed: $version ($tag)"
